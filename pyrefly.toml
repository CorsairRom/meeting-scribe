project-includes = ["src/**/*.py", "tests/**/*.py", "review-app/src/**/*.py"]
project-excludes = [
    # `gi` has no stubs in the project venv (system Python only): the ui package is not type
    # checked here; its logic lives in core, which is (rules registry GO-050).
    "review-app/src/meeting_scribe_review/ui/**",
    "**/node_modules",
    "**/__pycache__",
    "**/*venv/**",
    "**/.[!/.]*/**",
]
use-ignore-files = true
search-path = ["src", "review-app/src", "."]
disable-search-path-heuristics = false
site-package-path = []

python-platform = "linux"
python-version = "3.12"
skip-interpreter-query = false

untyped-def-behavior = "check-and-infer-return-type"
permissive-ignores = false

[errors]
