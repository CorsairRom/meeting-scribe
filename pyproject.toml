[project]
name = "meeting-scribe"
version = "0.1.0"
description = "Local GPU-accelerated meeting assistant: record, transcribe, diarize and summarize"
readme = "README.md"
authors = [
    { name = "Richard", email = "rromero@heligrafics.net" },
]
requires-python = "~=3.12.0"
dependencies = [
    "dbus-fast>=5.2.0",
    "openai>=3.29.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.9.0",
    "returns>=0.25.0",
]

[project.optional-dependencies]
quality-assurance = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.12.0",
    "pyrefly>=0.42.0",
    "import-linter>=2.0",
]
ml = [
    "faster-whisper>=1.2.1",
    "numpy>=2.5.3",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12==9.*",
    "pyannote-audio>=4.0.7",
]

[project.scripts]
meeting-scribe = "meeting_scribe.cli:run"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "meeting_scribe"
module-root = "src"

[tool.pytest.ini_options]
pythonpath = ["src", "review-app/src"]
testpaths = ["tests"]
python_files = ["*test*.py"]
addopts = "-q -m 'not gpu'"
markers = [
    "dbus: runs against a private dbus-daemon session bus (skipped when dbus-daemon is not on PATH)",
    "ffmpeg: runs real ffmpeg on synthetic lavfi sources only (skipped when ffmpeg is not on PATH)",
    "gpu: loads a real model on the GPU with synthetic audio (excluded by default; run with -m gpu)",
]

[tool.coverage.run]
source = ["meeting_scribe", "meeting_scribe_review"]
branch = true

[tool.importlinter]
root_packages = ["meeting_scribe", "meeting_scribe_review"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domains recording, transcription, speakers and summaries are independent"
type = "independence"
modules = [
    "meeting_scribe.recording",
    "meeting_scribe.transcription",
    "meeting_scribe.speakers",
    "meeting_scribe.summaries",
]

[[tool.importlinter.contracts]]
name = "Layers per package: infrastructure > application > domain"
type = "layers"
layers = ["infrastructure", "application", "domain"]
containers = [
    "meeting_scribe.base",
    "meeting_scribe.recording",
    "meeting_scribe.transcription",
    "meeting_scribe.speakers",
    "meeting_scribe.summaries",
    "meeting_scribe.meetings",
]

[[tool.importlinter.contracts]]
name = "meetings only depends on other domains through their application layer"
type = "forbidden"
source_modules = ["meeting_scribe.meetings"]
forbidden_modules = [
    "meeting_scribe.recording.domain",
    "meeting_scribe.recording.infrastructure",
    "meeting_scribe.transcription.domain",
    "meeting_scribe.transcription.infrastructure",
    "meeting_scribe.speakers.domain",
    "meeting_scribe.speakers.infrastructure",
    "meeting_scribe.summaries.domain",
    "meeting_scribe.summaries.infrastructure",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Shared kernel does not depend on the domains"
type = "forbidden"
source_modules = ["meeting_scribe.base"]
forbidden_modules = [
    "meeting_scribe.recording",
    "meeting_scribe.transcription",
    "meeting_scribe.speakers",
    "meeting_scribe.summaries",
    "meeting_scribe.meetings",
]

[[tool.importlinter.contracts]]
name = "Domain layers do not import frameworks"
type = "forbidden"
source_modules = [
    "meeting_scribe.base.domain",
    "meeting_scribe.recording.domain",
    "meeting_scribe.transcription.domain",
    "meeting_scribe.speakers.domain",
    "meeting_scribe.summaries.domain",
    "meeting_scribe.meetings.domain",
]
forbidden_modules = ["pydantic_settings", "dbus_fast", "gi"]

[[tool.importlinter.contracts]]
name = "Summaries domain and application stay free of HTTP and settings libraries"
type = "forbidden"
source_modules = ["meeting_scribe.summaries.domain", "meeting_scribe.summaries.application"]
forbidden_modules = ["httpx", "openai", "pydantic_settings", "dbus_fast"]

[[tool.importlinter.contracts]]
name = "Domain packages do not import settings or the composition root"
type = "forbidden"
source_modules = [
    "meeting_scribe.base",
    "meeting_scribe.recording",
    "meeting_scribe.transcription",
    "meeting_scribe.speakers",
    "meeting_scribe.summaries",
    "meeting_scribe.meetings",
]
forbidden_modules = ["meeting_scribe.main", "meeting_scribe.settings"]

[[tool.importlinter.contracts]]
name = "The service never imports ML libraries (only the two backends do, in the worker)"
type = "forbidden"
source_modules = ["meeting_scribe"]
forbidden_modules = ["faster_whisper", "ctranslate2", "torch", "torchaudio", "pyannote"]
ignore_imports = [
    "meeting_scribe.transcription.infrastructure.faster_whisper_backend -> faster_whisper",
    "meeting_scribe.transcription.infrastructure.faster_whisper_backend -> ctranslate2",
    "meeting_scribe.speakers.infrastructure.pyannote_backend -> torch",
    "meeting_scribe.speakers.infrastructure.pyannote_backend -> pyannote",
]

[[tool.importlinter.contracts]]
name = "The service entry point never reaches the worker or its ML backends"
type = "forbidden"
source_modules = ["meeting_scribe.main"]
forbidden_modules = [
    "meeting_scribe.worker",
    "meeting_scribe.transcription.infrastructure.faster_whisper_backend",
    "meeting_scribe.speakers.infrastructure.pyannote_backend",
]

[[tool.importlinter.contracts]]
name = "The app core never imports gi"
type = "forbidden"
source_modules = ["meeting_scribe_review.core"]
forbidden_modules = ["gi"]

[[tool.importlinter.contracts]]
name = "The app and the service are independent"
type = "independence"
modules = ["meeting_scribe", "meeting_scribe_review"]

[[tool.importlinter.contracts]]
name = "The app has no service-side dependencies"
type = "forbidden"
source_modules = ["meeting_scribe_review"]
forbidden_modules = ["pydantic", "pydantic_settings", "returns", "dbus_fast", "numpy"]

[[tool.importlinter.contracts]]
name = "App layers: ui over core"
type = "layers"
layers = ["ui", "core"]
containers = ["meeting_scribe_review"]
