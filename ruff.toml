line-length = 100

lint.select = [
    "E",
    "W",
    "F",
    "C90",
    "I",
    "N",
    "UP",
    "ANN",
    "ASYNC",
    "S",
    "B",
    "A",
    "C4",
    "DTZ",
    "T10",
    "EM",
    "ISC",
    "ICN",
    "G",
    "RET",
    "SLF",
    "SIM",
    "TID",
    "ARG",
    "PTH",
    "PL",
    "TRY",
    "PERF",
    "RUF",
    "Q",
]

lint.ignore = [
    "ISC001",
    "G004",
    "ANN401",
    "TRY400",
    "EM101",
    "EM102",
    "TRY003",
]

[lint.per-file-ignores]
"tests/**" = [
    "ANN001",
    "ANN201",
    "ANN202",
    "S101",
    "PLR2004",
    "SLF001",
]

# D-Bus member names are PascalCase by convention (api-contracts.md).
"src/**/infrastructure/dbus/*_interface.py" = ["N802"]

[lint.pylint]
max-args = 10
