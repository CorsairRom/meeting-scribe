line-length = 100

lint.select = [
    "E",
    "W",
    "F",
    "C90",
    "I",
    "N",
    "UP",
    "ANN",
    "ASYNC",
    "S",
    "B",
    "A",
    "C4",
    "DTZ",
    "T10",
    "EM",
    "ISC",
    "ICN",
    "G",
    "RET",
    "SLF",
    "SIM",
    "TID",
    "ARG",
    "PTH",
    "PL",
    "TRY",
    "PERF",
    "RUF",
    "Q",
]

lint.ignore = [
    "ISC001",
    "G004",
    "ANN401",
    "TRY400",
    "EM101",
    "EM102",
    "TRY003",
]

[lint.per-file-ignores]
"tests/**" = [
    "ANN001",
    "ANN201",
    "ANN202",
    "S101",
    "PLR2004",
    "SLF001",
]

# Fakes and scripted behaviours implement ports and callbacks and ignore some arguments. Listed
# per file so unused arguments stay flagged everywhere else, production code included.
"tests/fakes/**" = ["ARG001", "ARG002", "ARG005"]
"tests/unit/meetings/fakes.py" = ["ARG001", "ARG002", "ARG005"]
"tests/unit/speakers/fakes.py" = ["ARG001", "ARG002", "ARG005"]
"tests/unit/meetings/test_processing_controller.py" = ["ARG001", "ARG002", "ARG005"]
"tests/unit/meetings/test_processing_queue.py" = ["ARG001", "ARG002", "ARG005"]
"tests/unit/meetings/test_subprocess_worker_runner.py" = ["ARG001", "ARG002", "ARG005"]
"tests/unit/meetings/test_transcribe_stage.py" = ["ARG001", "ARG002", "ARG005"]
"tests/unit/transcription/*.py" = ["ARG001", "ARG002", "ARG005"]

# numpy belongs to the optional ``ml`` extra: these tests skip themselves when it is missing, so
# the importorskip has to run before the imports that need it.
"tests/unit/meetings/test_wav_mix_reader.py" = ["E402"]
"tests/unit/meetings/test_worker_stage_runner.py" = ["E402"]
"tests/unit/meetings/test_wav_channel_reader.py" = ["E402"]
"tests/unit/meetings/test_worker_diarize_stage.py" = ["E402"]
"tests/unit/speakers/test_filesystem_transcript_files.py" = ["E402"]

# D-Bus member names are PascalCase by convention (api-contracts.md).
"src/**/infrastructure/dbus/*_interface.py" = ["N802"]

[lint.pylint]
max-args = 10
